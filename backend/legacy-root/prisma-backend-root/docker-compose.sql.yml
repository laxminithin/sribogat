services:
  postgres:
    image: postgres:16-alpine
    container_name: kissanbandi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: kissanbandi
      POSTGRES_USER: kissanbandi
      POSTGRES_PASSWORD: kissanbandi_dev_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
