services:
  mysql:
    image: mysql:8.4
    container_name: kissanbandi-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: kissanbandi_new
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - backend_mysql:/var/lib/mysql

volumes:
  backend_mysql:
